name: mergeq oidc probe
on:
  pull_request:
  merge_group:
permissions:
  contents: read
  id-token: write
jobs:
  lab-merge-check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "lab-merge-check ok event=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
  oidc:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Claims and crates.io exchange
        run: |
          set -x
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io" | jq -r .value)
          echo "token_len=${#TOKEN}"
          echo "$TOKEN" > /tmp/tok
          python3 - <<'EOF'
          import base64,json
          t=open('/tmp/tok').read().strip().split('.')[1]
          t+='='*((4-len(t)%4)%4)
          c=json.loads(base64.urlsafe_b64decode(t))
          print("CLAIMS", json.dumps({k:c.get(k) for k in ["iss","aud","event_name","ref","ref_type","repository","repository_owner_id","workflow_ref","environment","sub","run_id","sha"]}))
          EOF
          echo "== crates.io exchange (no trusted-publisher config for this lab repo)"
          curl -sS -D /tmp/hdr -o /tmp/resp -w "HTTP=%{http_code}\n" -X POST \
            "https://crates.io/api/v1/trusted_publishing/tokens" \
            -H "Content-Type: application/json" -H "User-Agent: blume-research" \
            -d "{\"jwt\":\"$(cat /tmp/tok)\"}"
          echo "BODY:"; cat /tmp/resp; echo
